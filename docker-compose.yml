# Postgres for local development.
#   cp .env.example .env    # once, then fill in your own password
#   docker compose up -d
#
# Credentials come from the git-ignored .env file, so nothing secret lives in
# this file. The `:?` suffix makes compose refuse to start with a clear message
# if a variable is missing, instead of silently creating a database with an
# empty password.
services:
  postgres:
    image: postgres:16-alpine
    container_name: medgid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medgid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medgid-pgdata:
